[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "0.1.0"
description = "Détection d'intrusions réseau à grande échelle avec PySpark et Spark MLlib"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]